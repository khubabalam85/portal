<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>School Homework Diary</title>
<style>
:root{--ink:#1c1917;--paper:#fbfaf6;--card:#fff;--green:#14532d;--leaf:#dcefe0;--line:#e4e0d6;--mut:#6b665c;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,'Times New Roman',serif;color:var(--ink);background:var(--paper)}
h1,h2,h3,button,input,select,textarea,.chip{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-size:14px;background:var(--green);color:#fff}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
button.del{background:none;color:var(--red);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bar>*{flex:1;min-width:140px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.day{font:600 13px system-ui;color:var(--mut);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.hw{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.hw h3{margin:0 0 2px;font-size:16px}
.sub{display:inline-block;background:var(--leaf);color:var(--green);font:600 12px system-ui;border-radius:4px;padding:2px 8px;margin-bottom:6px}
.hw p{margin:4px 0;white-space:pre-wrap}
.meta{font:13px system-ui;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--leaf);border-radius:14px;padding:3px 4px 3px 10px;margin:3px;font:14px system-ui}
.note{background:#fff7e0;border:1px solid #f3d98b;border-radius:8px;padding:10px;font:13px system-ui;margin-bottom:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font:14px system-ui;display:none;z-index:9}
.hide{display:none!important}
@media print{header,.bar,.chips,button,.note{display:none!important}.hw{break-inside:avoid}}
@media(prefers-reduced-motion:no-preference){.hw{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header>
  <h1 id="school">School<small>Homework Diary</small></h1>
  <button class="ghost" id="tBtn">Teacher login</button>
</header>
<main>
  <div id="note" class="note hide"></div>

  <section id="login" class="panel hide">
    <h2 style="margin-top:0">Teacher login</h2>
    <div id="emailRow"><label>Email</label><input id="em" type="email" autocomplete="username"></div>
    <label id="pwLabel">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p><button id="goLogin">Log in</button></p>
  </section>

  <section id="teacher" class="hide">
    <div class="panel">
      <h2 style="margin-top:0">Add homework</h2>
      <div class="bar" style="margin:0">
        <div><label>Class</label><select id="fCls"></select></div>
        <div><label>Subject</label><select id="fSub"></select></div>
        <div><label>Date given</label><input type="date" id="fDate"></div>
        <div><label>Due date (optional)</label><input type="date" id="fDue"></div>
      </div>
      <label>Title</label><input id="fTitle" maxlength="120" placeholder="e.g. Chapter 4 exercise">
      <label>Details</label><textarea id="fText" rows="4" placeholder="Pages, questions, instructions"></textarea>
      <label>Your name</label><input id="fBy" maxlength="60">
      <p><button id="save">Save homework</button></p>
    </div>
    <div class="panel">
      <h2 style="margin-top:0">Subjects</h2>
      <div id="subList"></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="newSub" placeholder="New subject name" maxlength="40"><button id="addSub" style="flex:none">Add</button></div>
    </div>
    <p><button class="ghost" style="color:var(--green)" id="out">Log out</button></p>
  </section>

  <section id="view">
    <div class="chips" id="chips" role="tablist" aria-label="Class"></div>
    <div class="bar">
      <div><label>Month</label><input type="month" id="vMonth"></div>
      <div><label>Subject</label><select id="vSub"></select></div>
      <div><label>Search</label><input id="vQ" placeholder="Search words"></div>
    </div>
    <div style="display:flex;gap:8px"><button class="ghost" style="color:var(--green)" onclick="window.print()">Print</button></div>
    <div id="list" aria-live="polite"></div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
/* ============ SETTINGS: edit this part only ============ */
const CONFIG = {
  schoolName: "My School",
  // Paste your Firebase web config here to turn on the cloud database.
  // Leave as null to test with local (single-device) storage.
  firebase: null,
  /* firebase: { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." }, */
  localPin: "1234"            // teacher PIN used only in local test mode
};
const DEFAULT_SUBJECTS = ["English","Urdu","Mathematics","Science","Islamiat","Social Studies","Computer","Drawing"];
const CLASSES = ["Play Group","KG",...Array.from({length:10},(_,i)=>"Class "+(i+1))];
/* ======================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const toast = m => { const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",2600); };

let store, subjects=[...DEFAULT_SUBJECTS], cls=localStorage.getItem("cls")||CLASSES[0], isTeacher=false;

async function initStore(){
  if(CONFIG.firebase){
    const b="https://www.gstatic.com/firebasejs/10.12.2/";
    const [A,S,U]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-firestore.js"),import(b+"firebase-auth.js")]);
    const app=A.initializeApp(CONFIG.firebase);
    const fs=S.initializeFirestore(app,{localCache:S.persistentLocalCache()});
    const au=U.getAuth(app);
    return {
      cloud:true,
      async get(c,m){const q=await S.getDocs(S.query(S.collection(fs,"homework"),S.where("cls","==",c),S.where("month","==",m)));return q.docs.map(d=>({id:d.id,...d.data()}));},
      async add(o){await S.addDoc(S.collection(fs,"homework"),o);},
      async del(id){await S.deleteDoc(S.doc(fs,"homework",id));},
      async getSubs(){const d=await S.getDoc(S.doc(fs,"settings","subjects"));return d.exists()?d.data().list:null;},
      async setSubs(list){await S.setDoc(S.doc(fs,"settings","subjects"),{list});},
      login:(e,p)=>U.signInWithEmailAndPassword(au,e,p),
      logout:()=>U.signOut(au),
      onAuth:cb=>U.onAuthStateChanged(au,u=>cb(!!u))
    };
  }
  const rd=k=>JSON.parse(localStorage.getItem(k)||"null"), wr=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  let cb=()=>{}, on=sessionStorage.getItem("t")==="1";
  return {
    cloud:false,
    async get(c,m){return (rd("hw")||[]).filter(x=>x.cls===c&&x.month===m);},
    async add(o){const a=rd("hw")||[];a.push({...o,id:Date.now()+""+Math.random()});wr("hw",a);},
    async del(id){wr("hw",(rd("hw")||[]).filter(x=>x.id!==id));},
    async getSubs(){return rd("subs");},
    async setSubs(l){wr("subs",l);},
    async login(_,p){if(p!==CONFIG.localPin)throw new Error("Wrong PIN");on=true;sessionStorage.setItem("t","1");cb(true);},
    async logout(){on=false;sessionStorage.removeItem("t");cb(false);},
    onAuth(f){cb=f;f(on);}
  };
}

function fillSubjects(){
  const opts=subjects.map(s=>`<option>${esc(s)}</option>`).join("");
  $("fSub").innerHTML=opts;
  const cur=$("vSub").value;
  $("vSub").innerHTML=`<option value="">All subjects</option>`+opts;
  $("vSub").value=subjects.includes(cur)?cur:"";
  $("subList").innerHTML=subjects.map((s,i)=>`<span class="tag">${esc(s)}<button class="del" data-i="${i}" aria-label="Remove ${esc(s)}">✕</button></span>`).join("");
}
function drawChips(){
  $("chips").innerHTML=CLASSES.map(c=>`<button class="chip${c===cls?" on":""}" role="tab" aria-selected="${c===cls}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("fCls").innerHTML=CLASSES.map(c=>`<option${c===cls?" selected":""}>${esc(c)}</option>`).join("");
}
async function load(){
  const m=$("vMonth").value||today().slice(0,7);
  $("list").innerHTML=`<div class="empty">Loading…</div>`;
  let rows;
  try{ rows=await store.get(cls,m); }catch(e){ $("list").innerHTML=`<div class="empty">Could not load homework. Check your internet and try again.</div>`; return; }
  const sub=$("vSub").value, q=$("vQ").value.trim().toLowerCase();
  rows=rows.filter(r=>(!sub||r.subject===sub)&&(!q||(r.title+" "+r.details).toLowerCase().includes(q)));
  rows.sort((a,b)=>b.date.localeCompare(a.date)||a.subject.localeCompare(b.subject));
  if(!rows.length){ $("list").innerHTML=`<div class="empty">No homework for ${esc(cls)} in this month.</div>`; return; }
  let html="",last="";
  for(const r of rows){
    if(r.date!==last){ last=r.date; const d=new Date(r.date+"T00:00:00"); html+=`<div class="day">${d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}${r.date===today()?" (today)":""}</div>`; }
    const wa="https://wa.me/?text="+encodeURIComponent(`${cls} – ${r.subject} (${r.date})\n${r.title}\n${r.details||""}${r.due?"\nDue: "+r.due:""}`);
    html+=`<article class="hw"><span class="sub">${esc(r.subject)}</span><h3>${esc(r.title)}</h3><p>${esc(r.details)}</p>
      <div class="meta">${r.due?`<span>Due ${esc(r.due)}</span>`:""}${r.by?`<span>By ${esc(r.by)}</span>`:""}<a href="${wa}" target="_blank" rel="noopener">Share on WhatsApp</a>${isTeacher?`<button class="del" data-id="${esc(r.id)}">Delete</button>`:""}</div></article>`;
  }
  $("list").innerHTML=html;
}
function setTeacher(on){
  isTeacher=on;
  $("teacher").classList.toggle("hide",!on);
  $("login").classList.add("hide");
  $("tBtn").textContent=on?"Teacher panel":"Teacher login";
  load();
}

async function main(){
  $("school").firstChild.textContent=CONFIG.schoolName;
  document.title=CONFIG.schoolName+" – Homework Diary";
  $("vMonth").value=today().slice(0,7); $("fDate").value=today();
  $("fBy").value=localStorage.getItem("by")||"";
  try{ store=await initStore(); }catch(e){ $("list").innerHTML=`<div class="empty">Could not start the database. Check your Firebase settings.</div>`; return; }
  if(!store.cloud){ $("note").classList.remove("hide"); $("note").textContent=`Test mode: data is saved only on this device. Teacher PIN is ${CONFIG.localPin}. Add your Firebase config to keep data safely in the cloud.`; $("emailRow").classList.add("hide"); $("pwLabel").textContent="PIN"; }
  try{ const s=await store.getSubs(); if(s&&s.length) subjects=s; }catch(e){}
  fillSubjects(); drawChips();
  store.onAuth(setTeacher);

  $("chips").onclick=e=>{const b=e.target.closest("[data-c]"); if(!b)return; cls=b.dataset.c; localStorage.setItem("cls",cls); drawChips(); load();};
  ["vMonth","vSub"].forEach(i=>$(i).onchange=load); $("vQ").oninput=load;
  $("tBtn").onclick=()=>{ if(isTeacher) $("teacher").scrollIntoView(); else $("login").classList.toggle("hide"); };
  $("goLogin").onclick=async()=>{ try{ await store.login($("em").value.trim(),$("pw").value); $("pw").value=""; toast("Logged in"); }catch(e){ toast(store.cloud?"Wrong email or password":"Wrong PIN"); } };
  $("out").onclick=()=>store.logout();
  $("subList").onclick=async e=>{ const b=e.target.closest("[data-i]"); if(!b)return; const n=subjects[b.dataset.i]; if(!confirm(`Remove "${n}" from the list? Old homework stays saved.`))return; subjects.splice(b.dataset.i,1); await store.setSubs(subjects); fillSubjects(); toast("Subject removed"); };
  $("addSub").onclick=async()=>{ const n=$("newSub").value.trim(); if(!n)return; if(subjects.some(s=>s.toLowerCase()===n.toLowerCase())) return toast("Subject already exists"); subjects.push(n); try{ await store.setSubs(subjects); }catch(e){ subjects.pop(); return toast("Could not save subject"); } $("newSub").value=""; fillSubjects(); toast("Subject added"); };
  $("save").onclick=async()=>{
    const title=$("fTitle").value.trim(), date=$("fDate").value;
    if(!title||!date) return toast("Add a title and date");
    const by=$("fBy").value.trim(); localStorage.setItem("by",by);
    const o={cls:$("fCls").value,subject:$("fSub").value,date,month:date.slice(0,7),due:$("fDue").value,title,details:$("fText").value.trim(),by,ts:Date.now()};
    $("save").disabled=true;
    try{ await store.add(o); toast("Homework saved"); $("fTitle").value=""; $("fText").value=""; cls=o.cls; $("vMonth").value=o.month; drawChips(); load(); }
    catch(e){ toast("Could not save. Check your internet and try again."); }
    $("save").disabled=false;
  };
  $("list").onclick=async e=>{ const b=e.target.closest("[data-id]"); if(!b||!confirm("Delete this homework?"))return; try{ await store.del(b.dataset.id); toast("Deleted"); load(); }catch(e){ toast("Could not delete"); } };
  load();
}
main();
</script>
</body>
</html>
